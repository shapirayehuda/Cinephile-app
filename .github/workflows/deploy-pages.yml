name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate OMDb API key secret
        env:
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}
        run: |
          if [ -z "$VITE_OMDB_API_KEY" ]; then
            echo "::error::Missing secret VITE_OMDB_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$VITE_OMDB_API_KEY" = "VITE_OMDB_API_KEY" ]; then
            echo "::error::Secret value must be your real OMDb key, not the text VITE_OMDB_API_KEY."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}

      # SPA: GitHub Pages uses 404.html for unknown routes
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
